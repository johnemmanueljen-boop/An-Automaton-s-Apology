[project]
name = "an-automatons-apology"
version = "1.0.0"
description = "Lean checks the proof. We check the claim: a statement-faithfulness auditor for AI-written, Lean-verified mathematics."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "marimo>=0.9"]
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "SIM108", "E501"]  # long lines are prompt text and regexes; `ruff format` wraps code

[tool.ruff.lint.per-file-ignores]
"app.py" = ["B018"]  # marimo displays a cell's last expression
